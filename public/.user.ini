; PHP upload limits for the document uploader. cPanel runs PHP-FPM, which reads
; .user.ini from the web root. The app caps each file at 8 MB (see
; DocumentController); these sit comfortably above that so an 8 MB file is never
; rejected by PHP before the app can validate it, and a small batch fits in one
; request. NOTE: PHP-FPM caches .user.ini for up to user_ini.cache_ttl (5 min),
; so for an instant change also set these in cPanel → MultiPHP INI Editor.
upload_max_filesize = 16M
post_max_size = 64M
max_file_uploads = 60
memory_limit = 256M
