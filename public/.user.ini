; PHP upload limits for the app (read by PHP-FPM/CGI on cPanel from the docroot).
; Team Chat caps attachments at 100 MB per file (see TeamMessageController::MAX_KB);
; PHP must allow at least that or the upload is rejected before Laravel validates it.
; post_max_size sits above upload_max_filesize to leave room for a multi-file message + form body.
; (The chat host is behind Cloudflare, which caps a request at 100 MiB — that ceiling, not
; this file, is what decides the real limit; see config/team.php.)
upload_max_filesize = 105M
post_max_size = 230M
max_file_uploads = 20
; A VA on a slow connection can take several minutes to send a big zip; PHP must keep reading.
max_input_time = 900
max_execution_time = 300
