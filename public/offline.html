<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline · Apex Growth Solutions</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, #1e293b, #0b1220 60%);
            color: #e2e8f0; text-align: center; padding: 24px;
        }
        .card { max-width: 420px; }
        .mark {
            width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 22px;
            background: linear-gradient(135deg, #38bdf8, #4f46e5);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 18px 40px rgba(79, 70, 229, .4);
        }
        .mark svg { width: 52px; height: 52px; }
        h1 { font-size: 22px; margin: 0 0 10px; font-weight: 800; letter-spacing: -.01em; }
        p { color: #94a3b8; line-height: 1.55; margin: 0 0 24px; font-size: 15px; }
        button {
            appearance: none; border: 0; cursor: pointer; font-weight: 700; font-size: 15px;
            color: #fff; padding: 12px 26px; border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #38bdf8);
            box-shadow: 0 10px 24px rgba(79, 70, 229, .35); transition: transform .15s, box-shadow .15s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(79, 70, 229, .5); }
        .hint { margin-top: 18px; font-size: 12.5px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 15 L50 49 H37 L32 39 L27 49 H14 Z" fill="#fff"/></svg>
        </div>
        <h1>You're offline</h1>
        <p>The Apex dashboard needs an internet connection to load your clients and tasks. Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
        <div class="hint">Your work is safe — nothing is stored on this device.</div>
    </div>
</body>
</html>
