---
deployment:
  tasks:
    # Each checkout deploys to its own folder: a checkout with a .deploy-target file
    # (the chat subdomain) uses that path; without one (the dashboard) it stays on
    # public_html. This lets the same repo deploy the dashboard and the chat app
    # independently, so deploying one never overwrites the other.
    - export DEPLOYPATH="$(cat .deploy-target 2>/dev/null || echo /home2/apexgrow/public_html/)"
    # Records a failed step so it can't pass unnoticed the way "|| true" used to.
    # It must NOT exit: these tasks share ONE shell that cPanel itself drives, so an exit here
    # kills that shell mid-script and cPanel never writes the "finished" state — the deploy
    # page then sits on "in progress" for ever instead of reporting anything. Note the step,
    # keep going, and read storage/logs/deploy-failed.txt afterwards.
    - 'fail() { echo "=== DEPLOY STEP FAILED: $1 ==="; { date -u; echo "$1"; } >> "$DEPLOYPATH/storage/logs/deploy-failed.txt" 2>/dev/null; return 0; }'
    - /bin/cp -R app $DEPLOYPATH || fail "copy app"
    - /bin/cp -R bootstrap $DEPLOYPATH || fail "copy bootstrap"
    - /bin/cp -R config $DEPLOYPATH || fail "copy config"
    - /bin/cp -R database $DEPLOYPATH || fail "copy database"
    - /bin/cp -R public $DEPLOYPATH || fail "copy public"
    - /bin/cp -R resources $DEPLOYPATH || fail "copy resources"
    - /bin/cp -R routes $DEPLOYPATH || fail "copy routes"
    - /bin/cp -R tests $DEPLOYPATH || fail "copy tests"
    - /bin/cp .htaccess $DEPLOYPATH || fail "copy .htaccess"
    - /bin/cp artisan $DEPLOYPATH || fail "copy artisan"
    - /bin/cp composer.json $DEPLOYPATH || fail "copy composer.json"
    - /bin/cp composer.lock $DEPLOYPATH || fail "copy composer.lock"
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp package-lock.json $DEPLOYPATH
    - /bin/cp phpunit.xml $DEPLOYPATH
    - /bin/cp vite.config.js $DEPLOYPATH
    - /bin/cp README.md $DEPLOYPATH
    # Ensure the runtime storage tree exists and is writable. storage/ is deliberately NOT
    # copied (it's runtime data), so a fresh docroot — like the chat subdomain — has none and
    # Laravel 500s trying to write compiled views/logs. mkdir -p is a no-op where it already
    # exists, so the established main site is left untouched.
    - mkdir -p "$DEPLOYPATH/storage/framework/cache/data" "$DEPLOYPATH/storage/framework/sessions" "$DEPLOYPATH/storage/framework/views" "$DEPLOYPATH/storage/logs" "$DEPLOYPATH/storage/app/public" "$DEPLOYPATH/storage/app/private" "$DEPLOYPATH/bootstrap/cache" || fail "storage tree"
    - chmod -R 775 "$DEPLOYPATH/storage" "$DEPLOYPATH/bootstrap/cache" 2>&1 || true
    # COMPOSER_MEMORY_LIMIT=-1 so a cold install on a fresh docroot can't die on the
    # default memory cap (that's what left the chat subdomain with no vendor/ the first time).
    - cd $DEPLOYPATH && COMPOSER_MEMORY_LIMIT=-1 /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader 2>&1 || fail "composer install"
    - cd $DEPLOYPATH && php artisan config:clear 2>&1 || fail "config:clear"
    - cd $DEPLOYPATH && php artisan route:clear 2>&1 || fail "route:clear"
    - cd $DEPLOYPATH && php artisan view:clear 2>&1 || fail "view:clear"
    # Plain migrate: the two checkouts share one database, but they are deployed one at a time.
    # An --isolated run needs a working cache lock on the shared DB, which is one more thing
    # that can go wrong during a deploy for a collision that doesn't happen in practice.
    - cd $DEPLOYPATH && php artisan migrate --force 2>&1 || fail "migrate"
    - cd $DEPLOYPATH && php artisan db:seed --class=TeamSeeder --force 2>&1 || fail "seed team"
    - cd $DEPLOYPATH && php artisan storage:link 2>&1 || true
    - cd $DEPLOYPATH && php artisan images:optimize 2>&1 || true
    # Auto-provision Web Push VAPID keys into .env if missing (no terminal needed).
    # Runs BEFORE config:cache so the freshly written keys get cached.
    - cd $DEPLOYPATH && php artisan webpush:install 2>&1 || true
    - cd $DEPLOYPATH && php artisan config:cache 2>&1 || fail "config:cache"
    - cd $DEPLOYPATH && php artisan route:cache 2>&1 || fail "route:cache"
    - cd $DEPLOYPATH && php artisan view:cache 2>&1 || fail "view:cache"
    # Leave a record of what is live, and of anything that failed on the way. Check
    # storage/logs/deployed-at.txt (when + which commit) and, if it exists,
    # storage/logs/deploy-failed.txt (which steps failed) in File Manager after a deploy.
    - 'cd $DEPLOYPATH && date -u > storage/logs/deployed-at.txt 2>/dev/null; echo "=== DEPLOY FINISHED ==="'
    # NOTE: we deliberately DO NOT flush sessions on deploy. Flushing wiped everyone's
    # session so the open app/browser held a dead CSRF token → "CSRF token mismatch" on
    # the next action. Sessions (and their CSRF tokens) now survive a deploy, so content
    # updates are seamless — nobody is logged out or interrupted. A shell update restarts
    # the desktop app on its own, which refreshes everything cleanly.
