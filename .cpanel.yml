---
deployment:
  tasks:
    # Each checkout deploys to its own folder: a checkout with a .deploy-target file
    # (the chat subdomain) uses that path; without one (the dashboard) it stays on
    # public_html. This lets the same repo deploy the dashboard and the chat app
    # independently, so deploying one never overwrites the other.
    - export DEPLOYPATH="$(cat .deploy-target 2>/dev/null || echo /home2/apexgrow/public_html/)"
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R bootstrap $DEPLOYPATH
    - /bin/cp -R config $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp -R resources $DEPLOYPATH
    - /bin/cp -R routes $DEPLOYPATH
    - /bin/cp -R tests $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp artisan $DEPLOYPATH
    - /bin/cp composer.json $DEPLOYPATH
    - /bin/cp composer.lock $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp package-lock.json $DEPLOYPATH
    - /bin/cp phpunit.xml $DEPLOYPATH
    - /bin/cp vite.config.js $DEPLOYPATH
    - /bin/cp README.md $DEPLOYPATH
    - cd $DEPLOYPATH && /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader 2>&1 || true
    - cd $DEPLOYPATH && php artisan config:clear 2>&1 || true
    - cd $DEPLOYPATH && php artisan route:clear 2>&1 || true
    - cd $DEPLOYPATH && php artisan view:clear 2>&1 || true
    - cd $DEPLOYPATH && php artisan migrate --force 2>&1 || true
    - cd $DEPLOYPATH && php artisan db:seed --class=TeamSeeder --force 2>&1 || true
    - cd $DEPLOYPATH && php artisan storage:link 2>&1 || true
    - cd $DEPLOYPATH && php artisan images:optimize 2>&1 || true
    # Auto-provision Web Push VAPID keys into .env if missing (no terminal needed).
    # Runs BEFORE config:cache so the freshly written keys get cached.
    - cd $DEPLOYPATH && php artisan webpush:install 2>&1 || true
    - cd $DEPLOYPATH && php artisan config:cache 2>&1 || true
    - cd $DEPLOYPATH && php artisan route:cache 2>&1 || true
    - cd $DEPLOYPATH && php artisan view:cache 2>&1 || true
    # Log everyone out on every deploy so the whole team logs back in on fresh
    # code/session state. Runs LAST, after config:cache, so it reads the live
    # session driver. (The earlier profile-save bounce was a validation bug, not
    # this — safe to flush on deploy as intended.)
    - cd $DEPLOYPATH && php artisan sessions:flush 2>&1 || true
